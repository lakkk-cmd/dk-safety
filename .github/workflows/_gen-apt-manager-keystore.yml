name: (one-off) Generate apt-manager-app release keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "keystore password"
        required: true
      key_password:
        description: "key password"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore apt-manager-release.keystore \
            -alias aptmanagerkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=대경이엔피, OU=dk-safety, O=대경이엔피, L=Gwangju, ST=Jeonnam, C=KR"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: apt-manager-release-keystore
          path: apt-manager-release.keystore
          retention-days: 1
